<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safar - Pakistan Tourism Chatbot</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
:root{--bg:#f3efe6;--ink:#17302b;--card:#fff;--me:#17302b;--accent:#c8553d;--line:#d9d2c2}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:620px;display:flex;flex-direction:column;height:100vh;padding:16px}
h1{margin:0 0 4px;font-size:1.7rem}
.sub{margin:0 0 12px;color:#5b6b66;font-size:.95rem}
.chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:8px 2px}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;white-space:pre-line;line-height:1.45;border:1px solid var(--line);background:var(--card)}
.msg.me{align-self:flex-end;background:var(--me);color:#fff;border-color:var(--me)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{border:1px solid var(--line);background:transparent;padding:6px 10px;border-radius:999px;cursor:pointer;font:inherit;font-size:.85rem}
.row{display:flex;gap:8px}
input{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
.send{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:0 18px;font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;
const SUGGESTIONS = ["Quiet mountain trip for a family", "Best time to visit Hunza", "Beaches in Pakistan", "Ancient history sites"];

function App() {
  const [msgs, setMsgs] = useState([{ from: "bot", text: "Assalam o Alaikum! Ask me where to travel in Pakistan." }]);
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const end = useRef(null);
  useEffect(() => end.current && end.current.scrollIntoView({ behavior: "smooth" }), [msgs]);

  async function send(message) {
    const q = message.trim();
    if (!q || busy) return;
    setMsgs(m => [...m, { from: "me", text: q }]);
    setText(""); setBusy(true);
    try {
      const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: q }) });
      const data = await res.json();
      setMsgs(m => [...m, { from: "bot", text: data.text }]);
    } catch (e) {
      setMsgs(m => [...m, { from: "bot", text: "The server is not reachable. Start it with: python app.py" }]);
    }
    setBusy(false);
  }

  return (
    <div className="app">
      <h1>Safar</h1>
      <p className="sub">Plan your trip across Pakistan by describing what you like.</p>
      <div className="chat" aria-live="polite">
        {msgs.map((m, i) => <div key={i} className={"msg " + (m.from === "me" ? "me" : "")}>{m.text}</div>)}
        <div ref={end} />
      </div>
      <div className="chips">{SUGGESTIONS.map(s => <button key={s} onClick={() => send(s)}>{s}</button>)}</div>
      <div className="row">
        <input value={text} onChange={e => setText(e.target.value)} onKeyDown={e => e.key === "Enter" && send(text)} placeholder="Where do you want to go?" aria-label="Your message" />
        <button className="send" onClick={() => send(text)}>Send</button>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
